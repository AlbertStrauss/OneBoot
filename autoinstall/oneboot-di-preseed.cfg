# OneBoot v1.4 legacy d-i automation, adapted from the attributed Flux preseed.
# This file exists ONLY in the separately built automatic initrd.
# Identity/password bytes arrive privately in /oneboot-profile after explicit Go.
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/get_domain string local
d-i netcfg/domain string local
d-i netcfg/wireless_wep string
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Bucharest
d-i clock-setup/ntp boolean true
d-i preseed/early_command string sh /oneboot-di early
# Ubuntu user-setup intentionally re-prompts when root-login=true and its hash
# is "!". Keep root locked during setup; the private late hook unlocks it and
# enables root SSH using the confirmed operator password before reboot.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/root-password-crypted password !
d-i passwd/user-fullname string OneBoot User
d-i passwd/username string user
d-i passwd/user-password-crypted password !
d-i passwd/user-default-groups string adm cdrom sudo
d-i user-setup/allow-password-weak boolean true
# Disk selection runs after storage drivers exist. Failure blocks before partman.
d-i partman/early_command string sh /oneboot-di disk
d-i partman-auto/method string regular
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt
d-i partman-auto/choose_recipe select oneboot
# A small BIOS boot area, EFI system partition and the remaining space as root.
# Only partman-auto/disk and grub-installer/bootdev selected by our helper apply.
d-i partman-auto/expert_recipe string \
  oneboot :: \
    1 1 1 free $iflabel{ gpt } $reusemethod{ } method{ biosgrub } . \
    512 512 512 fat32 $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    1024 4096 -1 ext4 $primary{ } method{ format } format{ } \
      use_filesystem{ } filesystem{ ext4 } mountpoint{ / } .
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# No global MD/LVM removal or erase-all-disks policy is supplied.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server netplan.io sudo
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
d-i apt-setup/services-select multiselect updates
d-i popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i preseed/late_command string sh /oneboot-di late
d-i finish-install/reboot_in_progress note
